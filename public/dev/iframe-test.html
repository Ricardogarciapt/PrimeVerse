<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de embed — PrimeVerse Charts</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#e6e9f2}
  .barra{padding:10px 14px;background:#141c34;font-weight:600}
  .estado{padding:8px 14px;font:13px/1.4 ui-monospace,monospace;color:#9fe870}
  .env{padding:0 14px 24px}
  iframe{width:100%;height:760px;border:0;display:block;background:#040507}
</style>
</head>
<body>
  <div class="barra">Cabeçalho falso do "hub" (fica por FORA do iframe)</div>
  <div class="estado" id="estado">à espera de primeverse:height…</div>
  <div class="env">
    <iframe id="primeverse-charts" src="/charts-primeverse?embed=1" allow="fullscreen" title="PrimeVerse Charts"></iframe>
  </div>
<script>
  (function () {
    var iframe = document.getElementById('primeverse-charts');
    var estado = document.getElementById('estado');
    var ORIGEM = window.location.origin;
    var contagem = 0;
    window.addEventListener('message', function (evento) {
      if (evento.origin !== ORIGEM) return;
      if (evento.source !== iframe.contentWindow) return;
      var dados = evento.data;
      if (!dados || dados.type !== 'primeverse:height') return;
      var altura = Number(dados.height);
      if (!isFinite(altura) || altura <= 0) return;
      altura = Math.min(Math.max(Math.round(altura), 600), 2400);
      iframe.style.height = altura + 'px';
      contagem++;
      estado.textContent = 'primeverse:height recebido ' + contagem + 'x — iframe a ' + altura + 'px';
    });
  })();
</script>
</body>
</html>
